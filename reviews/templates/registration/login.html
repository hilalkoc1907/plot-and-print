{% extends 'reviews/base.html' %}

{% block title %}Giriş Yap{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2 class="mb-4">Giriş Yap</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Giriş Yap</button>
        </form>
        <p class="mt-3">Hesabın yok mu? <a href="{% url 'register' %}">Kayıt ol</a></p>
    </div>
</div>
{% endblock %}
