{% if is_paginated %}
<nav class="mt-3">
    <ul class="pagination justify-content-center flex-wrap">
        {% if page_obj.has_previous %}
            <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}">‹ Önceki</a></li>
        {% endif %}
        {% for num in paginator.page_range %}
            <li class="page-item {% if num == page_obj.number %}active{% endif %}">
                <a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ num }}">{{ num }}</a>
            </li>
        {% endfor %}
        {% if page_obj.has_next %}
            <li class="page-item"><a class="page-link" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}">Sonraki ›</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
